name: kmsmerino
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
#  dropdown_formfield: # Dart 3 incompatible
  new_version_plus: ^0.1.1
  dio: ^5.9.0
  intl: ^0.20.2
  async: ^2.13.0
  image_cropper: ^11.0.0
  path: ^1.9.1
  getwidget: ^7.0.0
  fl_chart: ^1.1.1
  open_file: ^3.5.10
  permission_handler: ^12.0.1
  external_path: ^2.2.0


  get: ^4.7.3
  shared_preferences: ^2.5.3

  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5
  carousel_slider: ^5.1.1
  shimmer_animation: ^2.2.2+1
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  pointer_interceptor: ^0.10.1+2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  iconsax: ^0.0.8
  font_awesome_flutter: ^10.7.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  device_info_plus: ^12.3.0

  http_parser: any
  video_player: ^2.11.1
  chewie: ^1.13.0
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  # Images
  assets:
    - assets/


  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Thin.ttf
          style: italic


